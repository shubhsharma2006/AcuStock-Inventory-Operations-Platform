name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend
        continue-on-error: true

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-not-for-production
          MONGODB_URI: mongodb://localhost:27017/acustock_test

      - name: Test coverage
        run: npx c8 --reporter=text --reporter=lcov node --test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-not-for-production

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/web

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend/web

      - name: Build
        run: npm run build
        working-directory: frontend/web
        env:
          BACKEND_URL: http://localhost:5001
