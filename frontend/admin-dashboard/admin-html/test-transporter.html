<!DOCTYPE html>
<html>
<head>
  <title>Test Add Transporter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; margin-right: 10px; }
    button:hover { background: #45a049; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; white-space: pre-wrap; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Test Add Transporter</h1>
  <p>This page tests the transporter API directly.</p>
  
  <div class="form-group">
    <label>Transporter Name *</label>
    <input type="text" id="name" placeholder="Enter transporter name" value="Test Transporter Co">
  </div>
  
  <div class="form-group">
    <label>Phone *</label>
    <input type="text" id="phone" placeholder="Enter phone" value="9876543210">
  </div>
  
  <div class="form-group">
    <label>Email</label>
    <input type="text" id="email" placeholder="Enter email" value="test@transporter.com">
  </div>
  
  <div class="form-group">
    <label>GSTIN</label>
    <input type="text" id="gstin" placeholder="Enter GSTIN">
  </div>
  
  <div class="form-group">
    <label>City</label>
    <input type="text" id="city" placeholder="Enter city" value="Mumbai">
  </div>
  
  <button onclick="addTransporter()">Add Transporter</button>
  <button onclick="listTransporters()">List All Transporters</button>
  
  <div id="result"></div>
  
  <script>
    const API_URL = 'http://127.0.0.1:5001/api';
    
    async function addTransporter() {
      const resultDiv = document.getElementById('result');
      resultDiv.className = '';
      resultDiv.textContent = 'Sending request...';
      
      const data = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        contactPerson: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        gstin: document.getElementById('gstin').value,
        address: {
          city: document.getElementById('city').value,
          country: 'India'
        }
      };
      
      console.log('Sending data:', data);
      
      try {
        const res = await fetch(API_URL + '/logistics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(data)
        });
        
        const result = await res.json();
        console.log('Response:', result);
        
        if (res.ok) {
          resultDiv.className = 'success';
          resultDiv.textContent = 'SUCCESS!\n\n' + JSON.stringify(result, null, 2);
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = 'ERROR: ' + (result.message || res.status) + '\n\n' + JSON.stringify(result, null, 2);
        }
      } catch (err) {
        console.error('Error:', err);
        resultDiv.className = 'error';
        resultDiv.textContent = 'FETCH ERROR: ' + err.message;
      }
    }
    
    async function listTransporters() {
      const resultDiv = document.getElementById('result');
      resultDiv.className = '';
      resultDiv.textContent = 'Fetching transporters...';
      
      try {
        const res = await fetch(API_URL + '/logistics', {
          credentials: 'include'
        });
        
        const result = await res.json();
        console.log('Transporters:', result);
        
        if (res.ok) {
          const transporters = result.transporters || [];
          if (transporters.length === 0) {
            resultDiv.textContent = 'No transporters found in database.';
          } else {
            resultDiv.className = 'success';
            resultDiv.textContent = 'Found ' + transporters.length + ' transporter(s):\n\n' + 
              transporters.map(t => '• ' + t.name + ' (' + t.phone + ')').join('\n');
          }
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = 'ERROR: ' + result.message;
        }
      } catch (err) {
        console.error('Error:', err);
        resultDiv.className = 'error';
        resultDiv.textContent = 'FETCH ERROR: ' + err.message;
      }
    }
  </script>
</body>
</html>
