# ============================================================
# AcuStock Enterprise Nginx Production SSL Configuration
# 
# Features:
# - HTTP -> HTTPS 301 Permanent Redirect
# - TLS 1.2 & TLS 1.3 Hardened Cipher Suites
# - HTTP Strict Transport Security (HSTS)
# - Real-time WebSocket Upgrades (Socket.io)
# - Distributed Rate Limiting (30 req/sec with burst 50)
# - Next.js Cache Optimization (immutable static caching)
# - Let's Encrypt / Certbot Challenge Passthrough
# ============================================================

# Rate limiting zone (10MB memory zone holds ~160,000 IP addresses)
limit_req_zone $binary_remote_addr zone=acustock_api_limit:10m rate=30r/s;

# Upstream Backend Cluster
upstream acustock_backend {
    server 127.0.0.1:5001;
    keepalive 64;
}

# Upstream Frontend SSR Cluster
upstream acustock_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── 1. HTTP REDIRECT TO HTTPS & ACME CERTBOT CHALLENGE ───────
server {
    listen 80;
    listen [::]:80;
    server_name app.acustock.com api.acustock.com *.acustock.com;

    # Let's Encrypt Domain Verification Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS PRODUCTION EDGE SERVER ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.acustock.com api.acustock.com;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/app.acustock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.acustock.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.acustock.com/chain.pem;

    # TLS Protocols & Cipher Suite (Mozilla Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security & HSTS Headers (A+ Grade on SSL Labs)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Payload Limits (Supports high-res invoice OCR & document attachments)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── API ENDPOINTS & DOCS -> BACKEND ──────────────────────
    location /api/ {
        limit_req zone=acustock_api_limit burst=50 nodelay;

        proxy_pass http://acustock_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── REALTIME WEBSOCKET (SOCKET.IO) -> BACKEND ────────────
    location /socket.io/ {
        proxy_pass http://acustock_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── NEXT.JS STATIC ASSETS IMMUTABLE CACHE ────────────────
    location /_next/static/ {
        proxy_pass http://acustock_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ALL OTHER WEB TRAFFIC -> NEXT.JS SSR FRONTEND ────────
    location / {
        proxy_pass http://acustock_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

